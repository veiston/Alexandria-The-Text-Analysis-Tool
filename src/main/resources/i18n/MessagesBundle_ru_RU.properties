tour.skip=Пропустить обзор
tour.step=Шаг {current} из {total}
tour.welcomeTitle=Добро пожаловать в Alexandria!
tour.welcomeText=Alexandria – инструмент статистического анализа текстов на английском языке. Он помогает изучать тексты с помощью подсчета частотности слов, поиска фраз, ключевых абзацев, цитат и сравнений. Пройдите краткий обзор приложения, чтобы познакомиться с его основными возможностями. Вы сможете вернуться к этому руководству в любое время со страницы «Руководство пользователя».
tour.libraryTitle=Ваша Библиотека
tour.libraryText=Это первая страница приложения. Если у вас уже есть сохранённые проекты, вы найдёте их здесь. Откройте любой проект, чтобы продолжить работу с ним.
tour.createProjectTitle=Создайте проект
tour.createProjectText=Если у вас ещё нет проекта или вы хотите создать новый, нажмите + Новый проект на боковой панели.
tour.addTextTitle=Выберите способ добавления текста
tour.addTextText=Загрузите файл PDF или TXT либо выберите «Вставить текст», чтобы ввести текст вручную.
tour.projectNameTitle=Назовите проект
tour.projectNameText=Добавьте понятное название проекта, чтобы позже легко найти его в Библиотеке.
tour.fileNameTitle=Выберите имя файла
tour.fileNameText=Это имя необязательно. Оставьте поле пустым, чтобы использовать исходное имя файла.
tour.pasteTextTitle=Добавьте текст
tour.pasteTextText=Вставьте или напишите в этом поле текст, который хотите проанализировать.
tour.workspaceTitle=Выберите способ работы с текстом
tour.workspaceText=Выберите «Анализ» для работы с одним текстом или «Сравнение» для работы с несколькими текстами.
tour.createTitle=Создайте проект
tour.createText=Когда всё будет готово, нажмите «Создать проект», чтобы добавить текст и открыть его в выбранном рабочем пространстве.
tour.readerTitle=Читайте текст
tour.readerText=Текст открывается в Читалке. Используйте элементы управления ниже, чтобы увеличивать или уменьшать масштаб и переходить между страницами во время анализа.
tour.quotationTitle=Создайте цитату
tour.quotationText=Выделите фрагмент, который хотите сохранить, чтобы создать цитату. Это поможет собирать важные отрывки во время чтения. Чтобы сохранять цитаты в аккаунт, необходимо войти в систему.
tour.quotationsTitle=Просматривайте цитаты
tour.quotationsText=Нажмите «Цитаты», чтобы просмотреть отрывки, сохранённые как цитаты.
tour.analyzeTitle=Анализируйте текст
tour.analyzeText=Панель справа объединяет результаты анализа текста. Alexandria подсчитывает слова и их употребления для формирования этих результатов. Здесь можно просмотреть частотные слова, проанализировать слово или фразу и найти ключевые абзацы.
tour.frequentWordsTitle=Просматривайте частотные слова
tour.frequentWordsText=Этот список показывает пять слов, которые чаще всего используются в тексте. Распространённые слова, такие как «the» и «and», игнорируются. Нажмите на слово, чтобы увидеть его вхождения, частоту, соседние слова и все места, где оно встречается.
tour.searchTitle=Ищите и отслеживайте фразы
tour.searchText=Найдите слово или фразу в текущем тексте. Используйте «Нечёткий поиск» для приблизительных совпадений, «С учётом регистра» для учёта заглавных и строчных букв, «Только целое слово» для исключения частичных совпадений или «Стоп-слова» для исключения распространённых слов. Ваши запросы отображаются в разделе «Отслеживаемые слова»: там можно повторно открыть фразу, перейти между совпадениями или удалить её из списка.
tour.keyParagraphsTitle=Просматривайте ключевые абзацы
tour.keyParagraphsText=Раздел «Ключевые абзацы» определяет предложения, содержащие слова, часто используемые во всём тексте. Это помогает заметить повторяющиеся темы. Используйте кнопку «Перейти к», чтобы открыть нужную страницу в Читалке.
tour.saveAnalysisTitle=Сохраните результаты анализа
tour.saveAnalysisText=Используйте кнопку «Сохранить результаты», чтобы сохранить в Архиве текущие результаты анализа текста, поиска фразы или сравнения. Для сохранения результатов необходимо войти в систему.
tour.compareTitle=Сравнивайте тексты
tour.compareText=Выберите не менее двух текстов для сравнения. Каждый текст может быть PDF-файлом, TXT-файлом или вставленным текстом; в одном сравнении можно использовать разные форматы. Выбранные тексты отображаются рядом.
tour.comparisonTitle=Просмотрите результаты сравнения
tour.comparisonText=Оценка схожести в заголовке показывает, насколько похожи профили частоты слов в двух текстах.
tour.sharedWordsTitle=Просматривайте общие слова
tour.sharedWordsText=Раздел «Наиболее частые общие слова» содержит слова, встречающиеся в обоих текстах, и показывает количество каждого слова в документе A и документе Б. Выберите слово, чтобы найти его в обоих документах.
tour.searchBothTitle=Ищите в обоих текстах
tour.searchBothText=Найдите слово или фразу в обоих документах. «Нечёткий поиск» находит приблизительные совпадения, «С учётом регистра» учитывает регистр, «Только целое слово» исключает частичные совпадения, а «Стоп-слова» исключает распространённые слова. В разделе «Отслеживаемые слова» для документа A и документа Б сохраняются отдельные строки результатов.
tour.similarParagraphsTitle=Просматривайте похожие абзацы
tour.similarParagraphsText=Раздел «Ключевые абзацы» показывает наиболее близкие по содержанию фрагменты двух документов. Выберите предварительный просмотр фрагмента, чтобы открыть его расположение в соответствующей Читалке.
tour.saveComparisonTitle=Сохраните результаты сравнения
tour.saveComparisonText=Используйте «Сохранить результаты», чтобы сохранить сравнение и все отслеживаемые поисковые фразы в Архиве. Необходимо войти в систему, а оба текста должны быть сохранены в Библиотеке.
tour.archiveText=Откройте Архив, чтобы просмотреть результаты анализа текста, поиска фразы или сравнения, сохранённые во время работы с текстами.
tour.settingsText=Откройте «Настройки», чтобы управлять параметрами приложения.
tour.profileText=Используйте страницу «Профиль», чтобы создать аккаунт, войти в систему или отредактировать профиль, если вы уже вошли в систему.