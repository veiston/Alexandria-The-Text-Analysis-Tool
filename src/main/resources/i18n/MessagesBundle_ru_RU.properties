userGuide.subtitle=Руководство по использованию приложения
userGuide.startTour=Начать интерактивный обзор
userGuide.about1=Alexandria – приложение для работы с текстами на английском языке.
userGuide.about2=Вы можете добавить собственный текст или загрузить файл в формате TXT или PDF. Alexandria умеет искать нужные слова и фразы, подсчитывать слова и предложения, показывать наиболее часто используемые слова, анализировать конкретное слово или фразу и сравнивать несколько текстов.
userGuide.about3=Вы также можете сохранять в аккаунте свои тексты, результаты анализа, сравнения, результаты поиска и цитаты.
userGuide.newProject1=Нажмите + Новый проект на боковой панели, чтобы добавить текст.
userGuide.newProject2=Выберите «Загрузить файл» или «Вставить текст». Поддерживаются только файлы PDF и TXT.
userGuide.newProject3=Введите название проекта.
userGuide.newProject4=Выберите, где открыть проект. Режим «Анализ» позволяет изучать один текст, искать слова или фразы и просматривать его статистику. Режим «Сравнение» позволяет сравнивать использование слов в нескольких текстах.
userGuide.newProject5=Нажмите «Создать проект». Вы перейдёте на страницу «Анализ» или «Сравнение» в зависимости от выбранного режима. Проект будет добавлен в Библиотеку, чтобы вы могли вернуться к нему позже.
userGuide.analyzeTitle=Откройте текст для анализа
userGuide.analyzeIntroduction=Создайте новый проект и выберите «Анализ» или откройте существующий проект из Библиотеки. Режим «Анализ» работает с одним текстом за раз. Слева отображается Читалка, а на панели справа — автоматически рассчитанные «Частота фраз» и «Ключевые абзацы». Выбранный текст остаётся доступен в Библиотеке, поэтому вы сможете вернуться к тому же проекту позже.
userGuide.analyzeMethodsTitle=Как рассчитываются результаты анализа
userGuide.analyzeMethod1=Частота фраз: отображает пять слов, не являющихся стоп-словами, с наибольшим количеством вхождений. Фиксированный список стоп-слов исключает: the, be, to, of, and, a, in, that, have, i, it, for, not, on, with, he, as, you, do и at.
userGuide.analyzeMethod2=Анализ фразы: ищет слово или фразу без учёта регистра и показывает общее число вхождений, число вхождений на 1 000 слов, количество предложений и абзацев, содержащих фразу, а также пять наиболее частых соседних слов. Соседние слова учитываются в пределах пяти позиций по обе стороны от каждого совпадения. Стоп-слова исключаются.
userGuide.analyzeMethod3=Поиск частоты фразы: ищет слово или фразу в текущем тексте и показывает каждое совпадение с указанием страницы, если информация о страницах доступна, и до 40 символов окружающего контекста с каждой стороны. Настройки поиска позволяют учитывать регистр и искать только целые слова.
userGuide.analyzeMethod4=Нечёткий поиск: выполняет приближённый поиск без учёта регистра. Длина запроса ограничена 64 символами. Для запросов короче четырёх символов различия не допускаются, для запросов от четырёх до семи символов допускается одно различие, а для более длинных запросов — до двух различий.
userGuide.analyzeMethod5=Список отслеживаемых слов: сохраняет найденные слова и фразы с количеством их вхождений. Активная фраза выделяется в документе; также доступны сведения о фразе, переход к отдельным вхождениям и удаление отслеживаемой фразы.
userGuide.analyzeMethod6=Ключевые абзацы: текст разбивается на предложения. Каждому предложению присваивается оценка, равная сумме общей частоты слов в нём. Отображаются пять предложений с наибольшими оценками со ссылками на страницы и абзацы.
userGuide.compareTitle=Откройте тексты для сравнения
userGuide.compareIntroduction=Создайте новый проект и выберите «Сравнение» или откройте два проекта из Библиотеки. Режим «Сравнение» отображает документы рядом и рассчитывает результаты для обоих текстов. Используйте Читалку для просмотра документов или откройте «Цитаты» для работы с цитатами, сохранёнными из любого документа.
userGuide.compareMethodsTitle=Как рассчитываются результаты сравнения
userGuide.compareMethod1=Оценка схожести: сравнивает профили частоты слов в двух текстах и показывает процент вместе с обозначением низкой, умеренной или высокой схожести.
userGuide.compareMethod2=Наиболее частые общие слова: находит слова, которые встречаются в обоих текстах, ранжирует их по суммарному числу вхождений и показывает количество для каждого документа. Выберите слово, чтобы сравнить его как фразу.
userGuide.compareMethod3=Сравнение фраз: ищет слово или фразу без учёта регистра в каждом документе. Для каждого документа отображаются общее число вхождений и относительная частота на 1 000 слов.
userGuide.compareMethod4=Поиск в обоих текстах: ищет слово или фразу в обоих документах и выделяет каждое совпадение. Используйте элементы управления «Предыдущее» и «Следующее», чтобы переходить между совпадениями в двух документах. Список отслеживаемых слов хранит найденные фразы и общее количество совпадений.
userGuide.compareMethod5=Ключевые абзацы: сравнивает абзацы длиной не менее 50 символов. Пара отображается, если в ней совпадают не менее трёх слов из общего словаря. Показывается до пяти непересекающихся пар с наивысшими оценками схожести, со ссылками на страницы и абзацы, если они доступны.
userGuide.library1=Откройте Библиотеку, чтобы просмотреть тексты и проекты, сохранённые в аккаунте.
userGuide.library2=Используйте поле поиска, чтобы найти текст или проект.
userGuide.library3=Выберите проект и пункт «Открыть с помощью».
userGuide.library4=Выберите «Анализ» для работы с одним текстом или «Сравнение» для работы с несколькими текстами.
userGuide.archive1=Войдите в систему, чтобы получить доступ к Архиву.
userGuide.archive2=Выберите «Анализ текста», «Анализ фразы» или «Сравнения текстов».
userGuide.archive3=Используйте поле поиска, чтобы найти сохранённые результаты.
userGuide.archive4=Откройте сохранённый результат, чтобы просмотреть его, или удалите, когда он больше не нужен.
userGuide.profile1=Откройте «Профиль» на боковой панели.
userGuide.profile2=Выберите «Регистрация», чтобы создать аккаунт, или «Войти», если у вас уже есть аккаунт.
userGuide.profile3=После входа в систему вы сможете обновить данные профиля или изменить пароль.
userGuide.profile4=Вход в систему позволяет сохранять проекты и результаты в аккаунте.
userGuide.settings1=Используйте переключатель «Тёмная тема», чтобы выбрать светлое или тёмное оформление.
userGuide.settings2=Включите «Показывать обзор приложения при следующем запуске», чтобы увидеть это руководство при следующем открытии Alexandria.
userGuide.settingsNote=Настройки языка находятся в разработке и будут доступны позднее.

