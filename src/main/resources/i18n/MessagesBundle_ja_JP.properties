userGuide.subtitle=アプリケーションの使い方
userGuide.startTour=インタラクティブツアーを開始
userGuide.about1=Alexandria はテキストを扱うためのアプリケーションです。
userGuide.about2=独自のテキストを追加するか、TXTまたはPDFファイルをアップロードできます。Alexandriaでは、必要な単語やフレーズの検索、単語数と文数の集計、最も頻繁に使われる単語の表示、特定の単語やフレーズの分析、複数テキストの比較ができます。
userGuide.about3=テキスト、分析結果、比較結果、検索結果、引用をアカウントに保存することもできます。
userGuide.newProject1=テキストを追加するには、サイドバーの「+ 新しいプロジェクト」をクリックします。
userGuide.newProject2=「ファイルをアップロード」または「テキストを貼り付け」を選択します。PDFとTXTファイルのみ対応しています。
userGuide.newProject3=プロジェクト名を入力します。
userGuide.newProject4=プロジェクトを開く場所を選択します。「分析」では1つのテキストを調べ、単語やフレーズを検索し、統計情報を表示できます。「比較」では複数のテキストにおける単語の使用状況を比較できます。
userGuide.newProject5=「プロジェクトを作成」をクリックします。選択に応じて「分析」または「比較」ページに移動します。プロジェクトはライブラリに追加されるため、後で戻ることができます。
userGuide.analyzeTitle=分析するテキストを開く
userGuide.analyzeIntroduction=新しいプロジェクトを作成して「分析」を選択するか、ライブラリから既存のプロジェクトを開きます。「分析」は一度に1つのテキストを扱います。左側にはリーダーが表示され、右側のパネルには自動計算された「フレーズ頻度」と「重要な段落」が表示されます。選択したテキストはライブラリに残るため、後で同じプロジェクトに戻れます。
userGuide.analyzeMethodsTitle=分析結果の計算方法
userGuide.analyzeMethod1=フレーズ頻度: ストップワード以外で、生の出現回数が最も多い5つの単語を返します。固定のストップワード一覧では、the、be、to、of、and、a、in、that、have、i、it、for、not、on、with、he、as、you、do、at を除外します。
userGuide.analyzeMethod2=フレーズ分析: 大文字と小文字を区別せずに単語またはフレーズを照合し、総出現回数、1,000語あたりの出現回数、そのフレーズを含む文と段落の数、最も頻繁に現れる周辺語5件を表示します。周辺語は、各一致箇所の前後5語以内で数えられます。ストップワードは除外されます。
userGuide.analyzeMethod3=フレーズ頻度を検索: 現在のテキストから単語またはフレーズを検索し、ページ情報が利用できる場合はページ番号と、各側最大40文字の周辺コンテキストを含むすべての一致箇所を返します。検索設定では、大文字と小文字の区別および完全一致を制御できます。
userGuide.analyzeMethod4=あいまい検索: 大文字と小文字を区別しない近似一致を実行します。検索語は64文字までです。4文字未満の検索語では差異は許可されず、4〜7文字では1つ、8文字以上では最大2つの差異が許可されます。
userGuide.analyzeMethod5=追跡中の単語リスト: 検索した単語とフレーズ、およびその出現回数を保持します。ドキュメント内のアクティブなフレーズを示し、フレーズの詳細、個々の出現箇所への移動、追跡中のフレーズの削除に対応します。
userGuide.analyzeMethod6=重要な段落: テキストは文に分割されます。各文には、その文に含まれる単語の全体頻度の合計に等しいスコアが付けられます。スコアが最も高い5つの文が、ページおよび段落の参照情報とともに返されます。
userGuide.compareTitle=比較するテキストを開く
userGuide.compareIntroduction=新しいプロジェクトを作成して「比較」を選択するか、ライブラリから2つのプロジェクトを開きます。「比較」ではドキュメントが並べて表示され、両方のテキストの結果が計算されます。リーダーでドキュメントを確認するか、「引用」を開いていずれかのドキュメントから保存した引用を扱います。
userGuide.compareMethodsTitle=比較結果の計算方法
userGuide.compareMethod1=類似度スコア: 2つのテキストの単語頻度プロファイルを比較し、低・中・高の類似度ラベルとともに割合を表示します。
userGuide.compareMethod2=最も頻繁に共有される単語: 両方のテキストに出現する単語を見つけ、合計出現回数で順位付けし、各ドキュメントの回数を表示します。単語を選択すると、フレーズとして比較できます。
userGuide.compareMethod3=フレーズ比較: 各ドキュメント内で大文字と小文字を区別せずに単語またはフレーズを照合します。ドキュメントごとに、総出現回数と1,000語あたりの相対頻度を表示します。
userGuide.compareMethod4=両方のテキストを検索: 両方のドキュメントで単語またはフレーズを検索し、すべての一致箇所を強調表示します。「前へ」と「次へ」のコントロールで、2つのドキュメントにまたがる一致箇所間を移動できます。追跡中の単語リストには、検索したフレーズとその合計一致数が保持されます。
userGuide.compareMethod5=重要な段落: 50文字以上の段落を比較します。共通語彙から少なくとも3語を共有する場合、そのペアが表示されます。類似度スコアが最も高い、重複しないペアを最大5組、利用可能な場合はページと段落の参照情報とともに表示します。
userGuide.library1=ライブラリを開くと、アカウントに保存されているテキストとプロジェクトを表示できます。
userGuide.library2=検索フィールドを使用して、テキストまたはプロジェクトを見つけます。
userGuide.library3=プロジェクトを選択し、「開く方法」を選択します。
userGuide.library4=1つのテキストを扱うには「分析」を、複数のテキストを扱うには「比較」を選択します。
userGuide.archive1=アーカイブにアクセスするにはログインしてください。
userGuide.archive2=「テキスト分析」、「フレーズ分析」、または「テキスト比較」を選択します。
userGuide.archive3=検索フィールドを使用して保存済みの結果を見つけます。
userGuide.archive4=保存済みの結果を開いて確認するか、不要になったら削除します。
userGuide.profile1=サイドバーから「プロフィール」を開きます。
userGuide.profile2=アカウントを作成するには「登録」を、すでにアカウントをお持ちの場合は「ログイン」を選択します。
userGuide.profile3=ログイン後は、プロフィール情報の更新やパスワードの変更ができます。
userGuide.profile4=ログインすると、プロジェクトと結果をアカウントに保存できます。
userGuide.settings1=「ダークテーマ」スイッチを使用して、ライト表示とダーク表示を切り替えます。
userGuide.settings2=「次回起動時にユーザーガイドを表示」をオンにすると、次にAlexandriaを開いたときにこのガイドツアーが表示されます。
userGuide.settingsNote=言語設定は開発中です。後日利用可能になります。

