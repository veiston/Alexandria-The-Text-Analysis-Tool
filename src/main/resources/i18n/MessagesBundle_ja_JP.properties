tour.welcomeTitle=Alexandria へようこそ！
tour.welcomeText=Alexandria は、言語研究者のための統計的テキスト分析ツールです。単語頻度、フレーズ検索、重要な段落、引用、比較を通じてテキストを調べるのに役立ちます。アプリケーションの主な機能を知るために、簡単なツアーをご覧ください。このチュートリアルには、いつでも「ユーザーガイド」ページから戻れます。
tour.libraryTitle=あなたのライブラリ
tour.libraryText=これはアプリケーションの最初のページです。すでに保存済みのプロジェクトがある場合は、ここで見つけられます。任意のプロジェクトを開いて作業を続けてください。
tour.createProjectTitle=プロジェクトを作成
tour.createProjectText=まだプロジェクトがない場合、または新しいプロジェクトを作成する場合は、サイドバーの「+ 新しいプロジェクト」をクリックしてください。
tour.addTextTitle=テキストの追加方法を選択
tour.addTextText=PDFまたはTXTファイルをアップロードするか、「テキストを貼り付け」を選択して手動でテキストを入力します。
tour.projectNameTitle=プロジェクトに名前を付ける
tour.projectNameText=後でライブラリで見分けられるよう、わかりやすいプロジェクト名を付けてください。
tour.fileNameTitle=ファイル名を選択
tour.fileNameText=この名前は任意です。元のファイル名を使用するには、空欄のままにしてください。
tour.pasteTextTitle=テキストを追加
tour.pasteTextText=このフィールドに、分析したいテキストを貼り付けるか入力してください。
tour.workspaceTitle=テキストの作業方法を選択
tour.workspaceText=1つのテキストを扱うには「分析」を、複数のテキストを扱うには「比較」を選択してください。
tour.createTitle=プロジェクトを作成
tour.createText=準備ができたら、「プロジェクトを作成」をクリックしてテキストを追加し、選択したワークスペースで開きます。
tour.readerTitle=テキストを読む
tour.readerText=テキストはリーダーで開きます。下のコントロールを使用して、分析中に拡大・縮小したり、ページ間を移動したりできます。
tour.quotationTitle=引用を作成
tour.quotationText=保存したい箇所を選択して引用を作成します。これにより、読みながら重要な抜粋を集められます。引用をアカウントに保存するにはログインが必要です。
tour.quotationsTitle=引用を表示
tour.quotationsText=「引用」をクリックすると、引用として保存した箇所を確認できます。
tour.analyzeTitle=テキストを分析
tour.analyzeText=右側のパネルには、テキストの分析結果がまとめて表示されます。Alexandriaは単語とその使用回数を数えて、これらの結果を作成します。ここでは、頻出語の確認、単語やフレーズの分析、重要な段落の検索ができます。
tour.frequentWordsTitle=頻出語を確認
tour.frequentWordsText=このリストには、テキスト内で最も頻繁に使われる5つの単語が表示されます。「the」や「and」のような一般的な単語は無視されます。単語をクリックすると、出現回数、頻度、周辺語、出現したすべての場所を確認できます。
tour.searchTitle=フレーズを検索・追跡
tour.searchText=現在のテキストから単語またはフレーズを検索します。「あいまい検索」で近似一致を見つけ、「大文字と小文字を区別」で大文字・小文字を一致させ、「完全一致」で部分一致を除外し、「ストップワード」で一般的な単語を除外します。検索内容は「追跡中の単語」に表示され、フレーズを再度開く、一致箇所間を移動する、リストから削除することができます。
tour.keyParagraphsTitle=重要な段落を確認
tour.keyParagraphsText=「重要な段落」は、テキスト全体で頻繁に使われる単語を含む文を特定します。これにより、繰り返されるトピックに気づくことができます。「移動」ボタンを使用して、リーダーで該当ページを開いてください。
tour.saveAnalysisTitle=分析結果を保存
tour.saveAnalysisText=「結果を保存」ボタンを使用して、テキスト分析、フレーズ検索、または比較の現在の結果をアーカイブに保存します。結果を保存するにはログインが必要です。
tour.compareTitle=テキストを比較
tour.compareText=比較するテキストを少なくとも2つ選択します。各テキストはPDF、TXTファイル、または貼り付けたテキストにでき、1回の比較で異なる形式を組み合わせることもできます。選択したテキストは並べて表示されます。
tour.comparisonTitle=比較結果を確認
tour.comparisonText=ヘッダーの類似度スコアは、2つのテキストの単語頻度プロファイルがどれほど似ているかを要約して示します。
tour.sharedWordsTitle=共有語を確認
tour.sharedWordsText=「最も頻繁に共有される単語」には、両方のテキストに見られる語彙と、文書A・文書Bでの各単語の出現回数が表示されます。単語を選択すると、両方のドキュメントで検索できます。
tour.searchBothTitle=両方のテキストを検索
tour.searchBothText=両方のドキュメントで単語またはフレーズを検索します。「あいまい検索」は近似一致を見つけ、「大文字と小文字を区別」は大文字・小文字を一致させ、「完全一致」は部分一致を除外し、「ストップワード」は一般的な単語を除外します。「追跡中の単語」には、文書Aと文書Bの結果行が別々に保持されます。
tour.similarParagraphsTitle=類似した段落を確認
tour.similarParagraphsText=「重要な段落」には、2つのドキュメントで最も一致度の高い箇所が表示されます。箇所のプレビューを選択すると、対応するリーダー内の位置を開けます。
tour.saveComparisonTitle=比較結果を保存
tour.saveComparisonText=「結果を保存」を使用して、比較結果と追跡中の検索フレーズをアーカイブに保存します。ログインしている必要があり、両方のテキストがライブラリに保存されている必要があります。
tour.archiveText=アーカイブを開くと、テキストの作業中に保存したテキスト分析、フレーズ検索、比較の結果を表示できます。
tour.settingsText=「設定」を開いてアプリケーション設定を管理します。
tour.profileText=「プロフィール」ページでは、アカウントの作成、ログイン、ログイン済みの場合はプロフィールの編集ができます。

