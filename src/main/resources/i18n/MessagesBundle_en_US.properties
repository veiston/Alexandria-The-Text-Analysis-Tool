userGuide.subtitle=Guidelines for using the application
userGuide.startTour=Start Interactive Tour
userGuide.about1=Alexandria is an application for working with texts.
userGuide.about2=You can add your own text or upload a TXT or PDF file. Alexandria can search for the words and phrases you need, count words and sentences, show which words are used most often, analyze a specific word or phrase, and compare several texts.
userGuide.about3=You can also save your texts, analysis results, comparisons, search results, and quotations to your account.
userGuide.newProject1=Click + New Project in the sidebar to add a text.
userGuide.newProject2=Choose Upload File or Paste Text. Only PDF and TXT files are supported.
userGuide.newProject3=Enter the project name.
userGuide.newProject4=Choose where to open your project. Analyze lets you explore one text, search for words or phrases, and view its statistics. Compare lets you compare word use across several texts.
userGuide.newProject5=Click Create Project. You will be taken to either the Analyze or Compare page, depending on your selection. Your project will be added to your Library so you can return to it later.
userGuide.analyzeTitle=Open a text for analysis
userGuide.analyzeIntroduction=Create a new project and choose Analyze, or open an existing project from Library. Analyze works with one text at a time. Reader is shown on the left, while the panel on the right shows automatically calculated Term Frequency and Key Paragraphs. The selected text remains available in Library, so you can return to the same project later.
userGuide.analyzeMethodsTitle=How analysis results are calculated
userGuide.analyzeMethod1=Term Frequency: returns the five non-stop words with the highest raw occurrence counts. The fixed stop-word list excludes: the, be, to, of, and, a, in, that, have, i, it, for, not, on, with, he, as, you, do, and at.
userGuide.analyzeMethod2=Term analysis: matches a word or phrase without regard to case and reports total occurrences, occurrences per 1,000 words, the number of sentences and paragraphs containing the term, and the five most frequent neighbouring words. Neighbours are counted within five word positions on either side of each match. Stop words are excluded.
userGuide.analyzeMethod3=Search Term Frequency: searches the current text for a word or phrase and returns every matching occurrence with its page, when page information is available, and up to 40 characters of surrounding context on each side. Search settings can control case sensitivity and whole-word matching.
userGuide.analyzeMethod4=Fuzzy search: performs case-insensitive approximate matching. Queries are limited to 64 characters. Queries shorter than four characters allow no differences, queries of four to seven characters allow one difference, and longer queries allow up to two differences.
userGuide.analyzeMethod5=Tracked words list: keeps searched words and phrases with their occurrence counts. It marks the active term in the document, provides term details, and supports navigation to individual occurrences or removal of a tracked term.
userGuide.analyzeMethod6=Key Paragraphs: the text is split into sentences. Each sentence receives a score equal to the sum of the overall frequencies of its words. The five highest-scoring sentences are returned with their page and paragraph references.
userGuide.compareTitle=Open texts for comparison
userGuide.compareIntroduction=Create a new project and choose Compare, or open two projects from Library. Compare displays the documents side by side and calculates results for both texts. Use the Reader to review the documents, or open Quotations to work with quotations saved from either document.
userGuide.compareMethodsTitle=How comparison results are calculated
userGuide.compareMethod1=Similarity score: compares the word-frequency profiles of the two texts and shows a percentage together with a Low, Moderate, or High similarity label.
userGuide.compareMethod2=Most frequent shared words: finds words that occur in both texts, ranks them by their combined occurrence count, and shows the count for each document. Select a word to compare it as a term.
userGuide.compareMethod3=Term comparison: matches a word or phrase without regard to case in each document. For every document, it reports the total number of occurrences and the relative frequency per 1,000 words.
userGuide.compareMethod4=Search in both texts: searches both documents for a word or phrase and highlights every match. Use the previous and next controls to move through matches across the two documents. The tracked words list keeps searched terms and their total match counts.
userGuide.compareMethod5=Key paragraphs: compares paragraphs that are at least 50 characters long. A pair is shown when it shares at least three words from the common vocabulary. Up to five non-overlapping pairs with the highest similarity scores are displayed, with page and paragraph references when available.
userGuide.library1=Open Library to view the texts and projects saved to your account.
userGuide.library2=Use the search field to find a text or project.
userGuide.library3=Select a project and choose Open with.
userGuide.library4=Choose Analyze to work with one text, or Compare to work with several texts.
userGuide.archive1=Sign in to access your Archive.
userGuide.archive2=Choose Text analysis, Term analysis, or Text comparisons.
userGuide.archive3=Use the search field to find saved findings.
userGuide.archive4=Open a saved result to review it, or remove it when you no longer need it.
userGuide.profile1=Open Profile from the sidebar.
userGuide.profile2=Choose Register to create an account, or Log in if you already have one.
userGuide.profile3=When signed in, update your profile details or change your password.
userGuide.profile4=Signing in lets you save projects and findings to your account.
userGuide.settings1=Use the Dark theme switch to choose between the light and dark appearance.
userGuide.settings2=Turn on Show user tour on next launch to see this guided tour when you next open Alexandria.
