tour.welcomeTitle=Welcome to Alexandria!
tour.welcomeText=Alexandria is a statistical text analysis tool for language researchers. It can help you explore texts through word frequencies, term searches, key paragraphs, quotations, and comparisons. Take a quick tour through the application to get familiar with its main features. You can return to this tutorial at any time from the User Guide page.
tour.libraryTitle=Your Library
tour.libraryText=This is the first page of the application. If you already have saved projects, you can find them here. Open any project to continue working with it.
tour.createProjectTitle=Create a project
tour.createProjectText=If you do not have a project yet, or want to create a new one, click + New Project in the sidebar.
tour.addTextTitle=Choose how to add your text
tour.addTextText=Upload a PDF or TXT file, or choose Paste Text to enter the text manually.
tour.projectNameTitle=Name your project
tour.projectNameText=Add a clear project name so you can recognise it later in Library.
tour.fileNameTitle=Choose a file name
tour.fileNameText=This name is optional. Leave it blank to use the original file name.
tour.pasteTextTitle=Add your text
tour.pasteTextText=Paste or write the text you want to analyse in this field.
tour.workspaceTitle=Choose how to work with your text
tour.workspaceText=Choose Analyse to work with one text, or Compare to work with several texts.
tour.createTitle=Create your project
tour.createText=When you are ready, click Create Project to add your text and open it in the selected workspace.
tour.readerTitle=Read your text
tour.readerText=Your text opens in the reader. Use the controls below to zoom in or out and move between pages while you analyse it.
tour.quotationTitle=Create a quotation
tour.quotationText=Select a passage you want to keep to make it a quotation. This helps you collect important excerpts while you read. You need to be signed in to save quotations to your account.
tour.quotationsTitle=View your quotations
tour.quotationsText=Click Quotations to review the passages you have saved as quotations.
tour.analyzeTitle=Analyze your text
tour.analyzeText=The panel on the right brings together the analysis results for your text. Alexandria counts words and their uses to create these results. Here you can review frequent words, analyse a word or phrase, and find key paragraphs.
tour.frequentWordsTitle=Review frequent words
tour.frequentWordsText=This list shows the five words used most often in the text. Common words such as “the” and “and” are ignored. Click on a word to see its occurrences, frequency, nearby words, and every place where it appears.
tour.searchTitle=Search and track terms
tour.searchText=Search for a word or phrase in the current text. Use Fuzzy to find approximate matches, Case sensitive to match capitalisation, Whole word to exclude partial matches, or Stop words to exclude common words. Your searches appear in Tracked Words, where you can reopen a term, move through its matches, or remove it from the list.
tour.keyParagraphsTitle=Review key paragraphs
tour.keyParagraphsText=Key Paragraphs identifies sentences that contain words used frequently across the text. This can help you notice repeated topics. Use Go to button to open the relevant page in the reader.
tour.saveAnalysisTitle=Save your analysis
tour.saveAnalysisText=Use Save Findings button to keep the current results of a text analysis, term search, or comparison in Archive. You need to be signed in to save findings.
tour.compareTitle=Compare texts
tour.compareText=Choose at least two texts to compare. Each text can be a PDF, TXT file, or pasted text, and you can combine different formats in one comparison. The selected texts are shown side by side.
tour.comparisonTitle=Review the comparison
tour.comparisonText=The similarity score in the header summarises how alike the word-frequency profiles of the two texts are.
tour.sharedWordsTitle=Review shared words
tour.sharedWordsText=Most frequent shared words lists vocabulary found in both texts and shows each word's count in Doc A and Doc B. Select a word to search for it in both documents.
tour.searchBothTitle=Search both texts
tour.searchBothText=Search for a word or phrase across both documents. Fuzzy finds approximate matches, Case sensitive matches capitalisation, Whole word excludes partial matches, and Stop words excludes common words. Tracked Words keeps separate result rows for Doc A and Doc B.
tour.similarParagraphsTitle=Review similar paragraphs
tour.similarParagraphsText=Key Paragraphs shows the strongest matching passages from the two documents. Select a passage preview to open its location in the corresponding reader.
tour.saveComparisonTitle=Save comparison findings
tour.saveComparisonText=Use Save Findings to store the comparison and any tracked search terms in Archive. You need to be signed in, and both texts must be saved in your Library.
tour.archiveText=Open Archive to view the the results of a text analysis, term search, or comparison you saved while working with your texts.
tour.settingsText=Open Settings to manage application preferences.
tour.profileText=Use Profile page to create an account, sign in, or edit your profile if you are already signed in.

